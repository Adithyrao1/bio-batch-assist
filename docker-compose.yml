services:
  db:
    image: mysql:8.0
    container_name: bio_batch_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-too}
      MYSQL_DATABASE: ${DB_NAME:-bio_batch_assist}
      MYSQL_USER: ${DB_USER:-bio_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bio_batch_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bio_batch_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-bio_batch_assist}
      - DB_USER=${DB_USER:-bio_user}
      - DB_PASSWORD=${DB_PASSWORD:-change-me}
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "python manage.py migrate &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bio_batch_celery_worker
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-bio_batch_assist}
      - DB_USER=${DB_USER:-bio_user}
      - DB_PASSWORD=${DB_PASSWORD:-change-me}
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    command: celery -A config worker -l info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bio_batch_celery_beat
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-bio_batch_assist}
      - DB_USER=${DB_USER:-bio_user}
      - DB_PASSWORD=${DB_PASSWORD:-change-me}
      - DB_PORT=3306
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
    depends_on:
      - backend
      - redis
    command: celery -A config beat -l info

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
    container_name: bio_batch_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
